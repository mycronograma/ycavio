      <script>
      (function() {
        try {
          var stored = localStorage.getItem('mycronograma_theme') || localStorage.getItem('trilha_theme');
          var theme = stored ? JSON.parse(stored) : 'dark';
          var root = document.documentElement;
          root.classList.remove('dark', 'neon', 'neon-light');
          if (theme === 'light') {
            // light clean
          } else if (theme === 'neon-light') {
            root.classList.add('neon-light');
          } else if (theme === 'neon') {
            root.classList.add('dark', 'neon');
          } else if (theme === 'system') {
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            root.classList.toggle('dark', prefersDark);
          } else {
            root.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
